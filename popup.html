<!DOCTYPE html>
<html>
<head>
<style>
  body {
    width: 250px;
    height: 320px; /* ცოტათი გავზარდეთ სიმაღლე ღილაკისთვის */
    background-color: #0b0f1a;
    color: white;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0;
    border: 1px solid #1e293b;
  }
  .logo {
    font-size: 32px;
    color: #00d2ff;
    text-shadow: 0 0 15px #00d2ff;
    margin-bottom: 20px;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 50px;
    height: 24px;
    margin-bottom: 15px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #334155;
    transition: .4s;
    border-radius: 24px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 18px; width: 18px;
    left: 3px; bottom: 3px;
    background-color: white;
    transition: .4s;
    border-radius: 50%;
  }
  input:checked + .slider { background-color: #00d2ff; }
  input:checked + .slider:before { transform: translateX(26px); }

  .status-pill {
    border: 2px solid #00d2ff;
    border-radius: 50px;
    padding: 8px 25px;
    margin-bottom: 15px;
    transition: 0.3s;
    background: rgba(0, 0, 0, 0.2);
  }
  #statusText {
    color: #00d2ff;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 1px;
  }

  /* ახალი DEEP SCAN ღილაკის სტილი */
  #deepScanBtn {
    background: transparent;
    border: 1px solid #e74c3c;
    color: #e74c3c;
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 15px;
    transition: 0.3s;
  }
  #deepScanBtn:hover {
    background: #e74c3c;
    color: white;
    box-shadow: 0 0 10px #e74c3c;
  }

  .footer-text {
    font-size: 10px;
    color: #64748b;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="logo">V</div>
  <label class="switch">
    <input type="checkbox" id="shieldToggle" checked>
    <span class="slider"></span>
  </label>
  <div class="status-pill">
    <div id="statusText">SHIELD: ACTIVE</div>
  </div>
  
  <button id="deepScanBtn">DEEP SCAN (FORCE)</button>

  <div class="footer-text">VELOX MISSION</div>
  <script src="popup.js"></script>
</body>
</html>
